aid: justos
name: Justos
description: 'Justos is a Brazilian digital auto insurance insurtech founded in 2020 and headquartered in
  Barueri, São Paulo. Operating as a managing general agent (MGA), Justos uses smartphone-collected driving
  data (telematics) to reward safe drivers with lower, usage-based pricing — advertised as up to 30% cheaper
  than traditional plans — plus weekly bonuses and perks like gas vouchers, maintenance, and ride credits.
  Its products are distributed digitally through a consumer mobile app and a broker (corretor) portal, with
  claims tracked in-app and 24/7 support. Backed by Ribbit Capital, Kaszek, SoftBank Latin America and GGV;
  its auto insurance is underwritten by Companhia Excelsior de Seguros (SUSEP code 05690). No public developer
  API, OpenAPI, or developer portal is published at this time.'
